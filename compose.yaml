services:
  app:
    build: .
    image: pc-configurator:local
    restart: unless-stopped
    ports:
      - "${PC_CONFIGURATOR_BIND:-127.0.0.1}:${PC_CONFIGURATOR_PORT:-8080}:8080"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

volumes:
  app-data:
