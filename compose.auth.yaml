services:
  auth-setup:
    build: .
    image: pc-configurator:local
    command: ["node", "dist/src/auth-setup.js"]
    restart: "no"
    environment:
      NOX_AUTH_PUBLIC_URL: ${NOX_AUTH_PUBLIC_URL:?Set the NoX Auth HTTPS origin}
      PC_CONFIGURATOR_PUBLIC_URL: ${PC_CONFIGURATOR_PUBLIC_URL:?Set the exact browser-facing origin}
    volumes:
      - app-data:/data
      - nox-auth-admin:/run/nox-auth-admin
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    depends_on:
      auth-setup:
        condition: service_completed_successfully
    environment:
      PC_CONFIGURATOR_OWNER_EMAIL: ${PC_CONFIGURATOR_OWNER_EMAIL:?Set the owner verified email}
    volumes:
      - nox-suite-local:/run/nox-suite

volumes:
  nox-suite-local:
    name: ${NOX_SUITE_LOCAL_VOLUME_NAME:-nox-suite-local}
    external: true
  nox-auth-admin:
    name: ${NOX_AUTH_ADMIN_VOLUME_NAME:-nox-auth-admin}
    external: true
